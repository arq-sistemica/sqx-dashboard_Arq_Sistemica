<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQX — Backtest</title>
<script src="supabase.js"></script>
<script src="sidebar.js"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#ffffff;--bg2:#f8f9fa;--bg3:#f1f3f5;--border:#e0e3e8;--border2:#c8cdd5;
  --text:#111318;--text2:#4a5060;--text3:#9098a8;
  --green:#1a7f4b;--green-bg:#eaf7f0;--green-border:#b2dfc8;
  --red:#b91c1c;--red-bg:#fef2f2;--red-border:#fcc;
  --amber:#92400e;--amber-bg:#fffbeb;--amber-border:#fde68a;
  --accent:#4f46e5;--accent-light:#eef2ff;
  --radius:6px;--radius-lg:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5}

/* page header */
.page-topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid var(--border);background:var(--bg);gap:12px;flex-wrap:wrap}
.page-topbar h1{font-size:15px;font-weight:700;letter-spacing:-0.2px}
.page-topbar .sub{font-size:12px;color:var(--text3);margin-top:1px}
.topbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* buttons */
button{height:32px;padding:0 14px;border-radius:var(--radius);font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border2);background:var(--bg);color:var(--text2);transition:all 0.12s;font-family:inherit}
button:hover{background:var(--bg3);color:var(--text);border-color:#adb5bd}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:#4338ca;color:#fff;border-color:#4338ca}

/* filter bar */
.filters-bar{display:flex;align-items:center;gap:6px;padding:8px 24px;border-bottom:1px solid var(--border);flex-wrap:wrap;background:var(--bg)}
.filter-label{font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:0.4px}
.fbtn{height:26px;padding:0 11px;font-size:11px;font-weight:500;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--text2);cursor:pointer;font-family:inherit}
.fbtn:hover{background:var(--bg3);color:var(--text)}
.fbtn.active{background:var(--accent-light);border-color:#c7d2fe;color:var(--accent);font-weight:600}
select.filter-sel{height:26px;padding:0 8px;border:1px solid var(--border2);border-radius:var(--radius);font-size:12px;background:var(--bg);color:var(--text2);font-family:inherit}
.filter-count{margin-left:auto;font-size:11px;color:var(--text3)}

/* table card */
.table-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:clip;margin:16px 24px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{background:var(--bg2);padding:8px 10px;text-align:right;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap;border-bottom:1px solid var(--border);cursor:pointer;user-select:none}
thead th:hover{color:var(--text2);background:var(--bg3)}
thead th.left{text-align:left}
tbody tr{border-bottom:1px solid var(--border);cursor:pointer}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--bg2)}
tbody tr.expanded{background:var(--accent-light)}
td{padding:8px 10px;text-align:right;color:var(--text2);white-space:nowrap}
td.left{text-align:left;color:var(--text);font-weight:600}
td.num{text-align:right}

/* badges */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.badge-green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.badge-red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.badge-gray{background:var(--bg3);color:var(--text3);border:1px solid var(--border)}
.pass{color:var(--green)!important;font-weight:600}
.fail{color:var(--red)!important;font-weight:600}
.warn{color:#d97706!important;font-weight:600}
.na{color:var(--text3)!important}

/* expanded detail */
.detail-row td{padding:0!important;white-space:normal}
.detail-inner{padding:20px 24px;border-top:2px solid var(--accent-light);background:var(--bg)}
.detail-section{margin-bottom:20px}
.detail-title{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}
.metrics-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.metric-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px}
.metric-item .m-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.4px;font-weight:600}
.metric-item .m-value{font-size:15px;font-weight:700;color:var(--text);margin-top:3px}
.metric-item .m-value.pass{color:var(--green)}
.metric-item .m-value.warn{color:#d97706}
.metric-item .m-value.fail{color:var(--red)}
.metric-item .m-value.na{color:var(--text3)}

/* monthly table */
.monthly-table{border-collapse:collapse;font-size:11px;width:100%}
.monthly-table th,.monthly-table td{border:1px solid var(--border);padding:4px 6px;text-align:right}
.monthly-table th{background:var(--bg2);font-weight:700;color:var(--text3);font-size:10px;text-transform:uppercase}
.monthly-table td.year-col{text-align:left;font-weight:700;background:var(--bg2);color:var(--text)}
.m-pos{color:var(--green);font-weight:600}.m-neg{color:var(--red);font-weight:600}

/* pseudocode */
.pseudo-block{font-size:12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px;max-height:220px;overflow-y:auto;white-space:pre-wrap;font-family:'Segoe UI Mono',Consolas,monospace;color:var(--text);line-height:1.6}
/* detail tabs */
.dtab-bar{display:flex;gap:2px;margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:0}
.dtab-btn{height:28px;padding:0 14px;border:none;background:none;font-size:12px;font-weight:500;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit}
.dtab-btn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.dtab-btn:hover:not(.active){color:var(--text2)}
.dtab-panel{display:none}.dtab-panel.active{display:block}
.kpi-sm{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px}
.kpi-sm-lbl{font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px}
.kpi-sm-val{font-size:13px;font-weight:600;color:var(--text)}
/* summary donuts */
.summary-panel{display:flex;align-items:center;justify-content:center;gap:32px;padding:14px 24px;border-bottom:1px solid var(--border);background:var(--bg);flex-wrap:wrap}
.summary-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px}
.donut-card{display:flex;align-items:center;gap:14px}
.donut-meta{display:flex;flex-direction:column;gap:4px}
.donut-meta-title{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px}
.donut-meta-row{font-size:12px;font-weight:600;color:var(--text2)}
.donut-meta-row span{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
.summary-divider{width:1px;height:80px;background:var(--border);flex-shrink:0}
.summary-context{font-size:12px;color:var(--text2);font-weight:600;margin-left:auto;white-space:nowrap}

/* toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:var(--radius);font-size:13px;font-weight:500;z-index:999;display:none;max-width:520px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.toast-ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.toast-err{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.empty-state{text-align:center;padding:60px 20px;color:var(--text3);font-size:13px}
</style>
</head>
<body>
<div id="toast-ok" class="toast toast-ok"></div>
<div id="toast-err" class="toast toast-err"></div>

<div class="page-topbar">
  <div>
    <h1>⚙️ SQX — Capa Backtest</h1>
    <div id="sync-status" style="font-size:12px;color:var(--text3);margin-top:2px">Cargando...</div>
  </div>
  <div class="topbar-right">
    <input type="file" id="sqx-input" webkitdirectory style="display:none" onchange="handleScanSQX(this.files);this.value=''">
    <button class="btn" onclick="document.getElementById('sqx-input').click()">⚙️ Scan carpeta SQX</button>
    <input type="file" id="pseudo-input" webkitdirectory style="display:none" onchange="handleScanPseudo(this.files);this.value=''">
    <button class="btn" onclick="document.getElementById('pseudo-input').click()">📝 Scan Pseudocódigos</button>
    <input type="file" id="overview-input" accept=".json" style="display:none" onchange="handleImportOverview(this.files);this.value=''">
    <button class="btn" onclick="document.getElementById('overview-input').click()">📥 Importar Overview backup</button>
    <button class="btn" id="btn-apikey" onclick="configAnthropicKey()" title="Configurar Anthropic API Key para análisis IA">🔑 API Key</button>
    <button class="btn" style="border-color:#fcc;color:var(--red)" onclick="deleteAllBots()">🗑 Borrar todo</button>
  </div>
</div>

<div class="filters-bar">
  <span class="filter-label">Filtro:</span>
  <button class="fbtn active" id="f-all"    onclick="setFilter('all')">Todos</button>
  <button class="fbtn"        id="f-passed" onclick="setFilter('passed')">✓ PASSED</button>
  <button class="fbtn"        id="f-failed" onclick="setFilter('failed')">✗ FAILED</button>
  <span class="filter-label" style="margin-left:8px">Symbol:</span>
  <select class="filter-sel" id="f-symbol" onchange="renderTable()"><option value="">Todos</option></select>
  <span class="filter-label">TF:</span>
  <select class="filter-sel" id="f-tf" onchange="renderTable()"><option value="">Todos</option></select>
  <span class="filter-label">Dir:</span>
  <select class="filter-sel" id="f-dir" onchange="renderTable()">
    <option value="">Todos</option>
    <option value="Long">Long</option>
    <option value="Short">Short</option>
    <option value="Both">Both</option>
  </select>
  <span class="filter-label">Orden:</span>
  <select class="filter-sel" id="f-orden" onchange="renderTable()">
    <option value="">Todos</option>
    <option value="Market">Market</option>
    <option value="Buy Stop">Buy Stop</option>
    <option value="Sell Stop">Sell Stop</option>
    <option value="Buy Limit">Buy Limit</option>
    <option value="Sell Limit">Sell Limit</option>
  </select>
  <span class="filter-count" id="f-count"></span>
</div>

<div id="summary-panel" class="summary-panel" style="display:none"></div>

<div class="table-card">
<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th class="left" onclick="sortBy('name')">Nombre<span id="s-name"></span></th>
        <th onclick="sortBy('magic')">Magic<span id="s-magic"></span></th>
        <th class="left" onclick="sortBy('symbol')">Par<span id="s-symbol"></span></th>
        <th class="left" onclick="sortBy('dir')">Dir<span id="s-dir"></span></th>
        <th class="left" onclick="sortBy('orderType')">Orden<span id="s-orderType"></span></th>
        <th class="left" onclick="sortBy('tf')">TF<span id="s-tf"></span></th>
        <th onclick="sortBy('isPf')">PF<span id="s-isPf"> ▼</span></th>
        <th onclick="sortBy('isWr2')">WR%<span id="s-isWr2"></span></th>
        <th onclick="sortBy('isRetdd')">Ret/DD<span id="s-isRetdd"></span></th>
        <th onclick="sortBy('isMaxDd')">Max DD%<span id="s-isMaxDd"></span></th>
        <th onclick="sortBy('isComplex')">Complexity<span id="s-isComplex"></span></th>
        <th onclick="sortBy('isEntry')">Entry<span id="s-isEntry"></span></th>
        <th onclick="sortBy('isTrades')">Trades<span id="s-isTrades"></span></th>
        <th onclick="sortBy('isFit')">Fitness<span id="s-isFit"></span></th>
        <th onclick="sortBy('isStab')">Stability<span id="s-isStab"></span></th>
        <th class="left" onclick="sortBy('filter')">Filtro<span id="s-filter"></span></th>
        <th></th>
      </tr>
    </thead>
    <tbody id="bots-tbody"></tbody>
  </table>
</div>
</div>

<script>
var DB = [];
var sortCol = 'isPf', sortDir = -1;
var filterMode = 'all';
var expandedId = null;

// ─── Helpers ────────────────────────────────────────────────────────
function authLogout() { if (typeof sb !== 'undefined') sb.signOut(); window.location.href = 'index.html'; }

function alertOk(m) {
  const e = document.getElementById('toast-ok');
  e.textContent = m; e.style.display = 'block';
  document.getElementById('toast-err').style.display = 'none';
  clearTimeout(e._t); e._t = setTimeout(() => e.style.display = 'none', 8000);
}
function alertErr(m) {
  const e = document.getElementById('toast-err');
  e.textContent = m; e.style.display = 'block';
  document.getElementById('toast-ok').style.display = 'none';
}
function setSyncStatus(msg, color) {
  const el = document.getElementById('sync-status');
  el.textContent = msg; el.style.color = color || 'var(--text3)';
}
function fmt(v, dec) {
  if (v === null || v === undefined) return '—';
  return Number(v).toFixed(dec ?? 2);
}
function getDirection(pseudo) {
  if (!pseudo) return null;
  const longFalse  = /LongEntrySignal\s*=\s*false\s*;/i.test(pseudo);
  const shortFalse = /ShortEntrySignal\s*=\s*false\s*;/i.test(pseudo);
  if (!longFalse && shortFalse) return 'Long';
  if (longFalse && !shortFalse) return 'Short';
  if (!longFalse && !shortFalse) return 'Both';
  return null;
}
function dirColor(d) { return d==='Long'?'pass': d==='Short'?'fail': d==='Both'?'warn':'na'; }
// Única fuente de verdad para el tipo de orden por bloque (Long/Short) — usada
// tanto por la tabla (getEntryType) como por parseSQXFile, para evitar dos
// regex independientes detectando lo mismo y quedando desincronizadas.
function getOrderBlocks(pseudo) {
  if (!pseudo) return {};
  const blocks = {};
  for (const m of pseudo.matchAll(/Open\s+(Long|Short)\s+order\s+at\s+([\s\S]*?);/gi)) {
    const isLong = /^long$/i.test(m[1]);
    const expr = m[2].trim();
    let type = null;
    if (/^market$/i.test(expr)) type = 'Market';
    else if (/\bstop\s*$/i.test(expr))  type = isLong ? 'Buy Stop'  : 'Sell Stop';
    else if (/\blimit\s*$/i.test(expr)) type = isLong ? 'Buy Limit' : 'Sell Limit';
    blocks[isLong ? 'Long' : 'Short'] = type;
  }
  return blocks;
}
function formatEntryTypes(blocks) {
  const types = [...new Set(Object.values(blocks).filter(Boolean))];
  return types.length ? types.join(' / ') : null;
}
function getEntryType(pseudo) { return formatEntryTypes(getOrderBlocks(pseudo)); }
function pfColor(v)     { return v==null?'na': v>=1.30?'pass': v>=1.20?'warn':'fail'; }
function ddColor(v)     { return v==null?'na': v<=10  ?'pass': v<=20  ?'warn':'fail'; }
function wrColor(v)     { return v==null?'na': v>=55  ?'pass': v>=45  ?'warn':'fail'; }
function cagrColor(v)   { return v==null?'na': v>=8   ?'pass': v>=5   ?'warn':'fail'; }
function sharpeColor(v) { return v==null?'na': v>=0.50?'pass': v>=0.30?'warn':'fail'; }
function tradesColor(v) { return v==null?'na': v>=500 ?'pass': v>=200 ?'warn':'fail'; }
function retddColor(v)  { return v==null?'na': v>=2   ?'pass': v>=1   ?'warn':'fail'; }
function cagrddColor(v) { return v==null?'na': v>=1   ?'pass': v>=0.5 ?'warn':'fail'; }
function fitColor(v)    { return v==null?'na': v>=0.8 ?'pass': v>=0.6 ?'warn':'fail'; }
function stabColor(v)   { return v==null?'na': v>=0.8 ?'pass': v>=0.6 ?'warn':'fail'; }
function npColor(v)     { return v==null?'na': v>0    ?'pass':          'fail'; }
function sqnColor(v)    { return v==null?'na': v>=1.6 ?'pass': v>=1.0 ?'warn':'fail'; }

function filterBadge(f) {
  if (!f) return '<span class="badge badge-gray">—</span>';
  const u = f.toUpperCase();
  if (u.includes('PASSED')) return '<span class="badge badge-green">PASSED</span>';
  if (u.includes('FAILED')) return '<span class="badge badge-red">FAILED</span>';
  return '<span class="badge badge-gray">' + f.slice(0, 12) + '</span>';
}

// ─── Filtros ─────────────────────────────────────────────────────────
function setFilter(mode) {
  filterMode = mode;
  ['all','passed','failed'].forEach(m => document.getElementById('f-' + m).classList.toggle('active', m === mode));
  renderTable();
}

function populateFilters() {
  const symbols = [...new Set(DB.map(b => b.symbol).filter(Boolean))].sort();
  const tfs     = [...new Set(DB.map(b => b.tf).filter(Boolean))].sort();
  const symSel = document.getElementById('f-symbol');
  const tfSel  = document.getElementById('f-tf');
  const ps = symSel.value, pt = tfSel.value;
  symSel.innerHTML = '<option value="">Todos</option>' + symbols.map(s => `<option${s===ps?' selected':''}>${s}</option>`).join('');
  tfSel.innerHTML  = '<option value="">Todos</option>' + tfs.map(t =>    `<option${t===pt?' selected':''}>${t}</option>`).join('');
}

function getFiltered() {
  const sym = document.getElementById('f-symbol').value;
  const tf  = document.getElementById('f-tf').value;
  return DB.filter(b => {
    if (filterMode === 'passed' && !(b.sqxFilter||'').toUpperCase().includes('PASSED')) return false;
    if (filterMode === 'failed' &&  (b.sqxFilter||'').toUpperCase().includes('PASSED')) return false;
    if (sym && b.symbol !== sym) return false;
    if (tf  && b.tf !== tf)     return false;
    const dir = document.getElementById('f-dir').value;
    if (dir && getDirection(b.pseudocodigo) !== dir) return false;
    const orden = document.getElementById('f-orden').value;
    if (orden && !(getEntryType(b.pseudocodigo)||'').split(' / ').includes(orden)) return false;
    return true;
  });
}

// ─── Sorting ──────────────────────────────────────────────────────────
var KEY = {
  name:       b => (b.name||'').toLowerCase(),
  magic:      b => b.magic || 0,
  symbol:     b => b.symbol||'',
  tf:         b => b.tf||'',
  isPf:      b => b.is?.pf                    ?? -Infinity,
  dir:       b => getDirection(b.pseudocodigo) || '',
  orderType: b => getEntryType(b.pseudocodigo) || '',
  isWr2:     b => b.standalone?.winning_percent ?? -Infinity,
  isRetdd:   b => b.is?.retdd                 ?? -Infinity,
  isMaxDd:   b => b.standalone?.max_dd_pct    ?? Infinity,
  isComplex: b => b.standalone?.complexity    ?? Infinity,
  isEntry:   b => b.standalone?.entry_indicators ?? -Infinity,
  isTrades:  b => b.is?.trades                ?? -Infinity,
  isFit:     b => b.is?.fitness               ?? -Infinity,
  isStab:    b => b.is?.stability             ?? -Infinity,
  filter:    b => b.sqxFilter||'',
};
function sortBy(col) {
  if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = -1; }
  document.querySelectorAll('thead span[id^="s-"]').forEach(el => el.textContent = '');
  const ind = document.getElementById('s-' + col);
  if (ind) ind.textContent = sortDir === -1 ? ' ▼' : ' ▲';
  renderTable();
}

// ─── Summary panel ────────────────────────────────────────────────────
function renderSummaryPanel() {
  const panel = document.getElementById('summary-panel');
  if (!panel) return;
  const bots = getFiltered();
  if (!bots.length) { panel.style.display = 'none'; return; }
  panel.style.display = 'flex';

  const C = 226.19; // 2 * π * 36

  // dirección
  const withDir = bots.filter(b => getDirection(b.pseudocodigo));
  const longN  = withDir.filter(b => getDirection(b.pseudocodigo) === 'Long').length;
  const shortN = withDir.filter(b => getDirection(b.pseudocodigo) === 'Short').length;
  const longPct  = withDir.length ? Math.round(longN  / withDir.length * 100) : 0;
  const shortPct = withDir.length ? Math.round(shortN / withDir.length * 100) : 0;
  const longArc  = longPct  / 100 * C;
  const shortArc = shortPct / 100 * C;

  // PF promedio
  const pfVals = bots.map(b => b.is?.pf).filter(v => v != null);
  const pfAvg  = pfVals.length ? pfVals.reduce((a,b)=>a+b,0)/pfVals.length : null;
  const pfArc  = pfAvg != null ? Math.min(pfAvg/2,1)*C : 0;
  const pfCol  = pfAvg == null ? '#e0e3e8' : pfAvg>=1.30?'#1a7f4b':pfAvg>=1.20?'#d97706':'#b91c1c';

  // DD% promedio
  const ddVals = bots.map(b => b.standalone?.max_dd_pct).filter(v => v != null);
  const ddAvg  = ddVals.length ? ddVals.reduce((a,b)=>a+b,0)/ddVals.length : null;
  const ddArc  = ddAvg != null ? Math.min(ddAvg/25,1)*C : 0;
  const ddCol  = ddAvg == null ? '#e0e3e8' : ddAvg<=10?'#1a7f4b':ddAvg<=20?'#d97706':'#b91c1c';

  const sym = document.getElementById('f-symbol').value;
  const tf  = document.getElementById('f-tf').value;
  const ctx = [sym||'Todos los pares', tf||''].filter(Boolean).join(' · ');

  function svg(arcs, centerTxt, subTxt) {
    let circles = `<circle cx="50" cy="50" r="36" fill="none" stroke="#e0e3e8" stroke-width="13"/>`;
    let offset = 0;
    arcs.forEach(([arc, color]) => {
      if (arc > 0) {
        circles += `<circle cx="50" cy="50" r="36" fill="none" stroke="${color}" stroke-width="13"
          stroke-dasharray="${arc} ${C}" stroke-dashoffset="${-offset}" transform="rotate(-90 50 50)" stroke-linecap="butt"/>`;
        offset += arc;
      }
    });

// ─── Ficha expandible ─────────────────────────────────────────────────
function toggleDetail(id) {
  const existing = document.getElementById('detail-' + id);
  if (existing) {
    existing.remove();
    document.querySelector(`tr[data-id="${id}"]`)?.classList.remove('expanded');
    expandedId = null;
    return;
  }
  if (expandedId) {
    document.getElementById('detail-' + expandedId)?.remove();
    document.querySelector(`tr[data-id="${expandedId}"]`)?.classList.remove('expanded');
  }
  expandedId = id;
  const bot = DB.find(b => String(b.magic || b.id) === id);
  if (!bot) return;
  document.querySelector(`tr[data-id="${id}"]`)?.classList.add('expanded');
  insertDetailRow(id, bot);
}

function insertDetailRow(id, bot) {
  const tr = document.querySelector(`tr[data-id="${id}"]`);
  if (!tr) return;
  const detail = document.createElement('tr');
  detail.className = 'detail-row';
  detail.id = 'detail-' + id;
  detail.innerHTML = '<td colspan="17"><div class="detail-inner">' + buildDetail(bot) + '</div></td>';
  tr.insertAdjacentElement('afterend', detail);
}

  ).join('') + '</div>';
}

function buildDetail(bot) {
  const is = bot.is || {};
  const id = String(bot.magic || bot.id);

  // ── pestaña Overview ──────────────────────────────────────────────
  let tabOverview = '';
  if (bot.overviewData?.monthlyData?.length) {
    const MONTHS = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
    // métricas resumen
    const m = bot.overviewData.metrics || {};
    if (Object.keys(m).length) {
      tabOverview += `<div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px;font-size:12px">
        ${[['PF', m.pf], ['DD%', m.ddPct ? m.ddPct+'%' : '—'], ['WR%', m.wr ? m.wr+'%' : '—'],
           ['Sharpe', m.sharpe], ['CAGR', m.cagr ? m.cagr+'%' : '—'], ['Trades', m.trades],
           ['Net P&L', m.totalProfit ? '$'+m.totalProfit : '—']].map(([k,v]) =>
          `<span style="background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:4px 10px">
            <span style="color:var(--text3)">${k}</span> <b>${v??'—'}</b></span>`).join('')}
      </div>`;
    }
    tabOverview += '<div style="overflow-x:auto;margin-bottom:12px"><table class="monthly-table"><thead><tr><th>Año</th>' +
      MONTHS.map(m => `<th>${m}</th>`).join('') + '<th>YTD</th></tr></thead><tbody>';
    bot.overviewData.monthlyData.forEach(row => {
      tabOverview += `<tr><td class="year-col">${row.year}</td>` +
        row.months.map(v => v === null || v === 0 ? '<td style="color:var(--text3)">—</td>' :
          `<td class="${v>=0?'m-pos':'m-neg'}">${v >= 0 ? '+' : ''}${v.toFixed(0)}</td>`).join('') +
        `<td class="${(row.ytd||0)>=0?'m-pos':'m-neg'}" style="font-weight:700">${row.ytd!==null?( row.ytd>=0?'+':'')+row.ytd.toFixed(0):'—'}</td></tr>`;
    });
    tabOverview += '</tbody></table></div>';
    (function() {
      const mNames = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
      const pts = [];
      let cum = 0;
      bot.overviewData.monthlyData.slice().sort((a,b) => a.year - b.year).forEach(row => {
        row.months.forEach((val, i) => {
          if (val === null || isNaN(val)) return;
          cum = Math.round((cum + val) * 100) / 100;
          pts.push({ label: mNames[i] + ' ' + row.year, y: cum });
        });
      });
      if (pts.length < 2) return;
      const W = 560, H = 180;
      const pad = { top: 16, right: 16, bottom: 32, left: 52 };
      const cw = W - pad.left - pad.right;
      const ch = H - pad.top  - pad.bottom;
      const vals = pts.map(p => p.y);
      const minV = Math.min(0, ...vals);
      const maxV = Math.max(0, ...vals);
      const range = maxV - minV || 1;
      const xS = i => (i / (pts.length - 1 || 1)) * cw;
      const yS = v => ch - ((v - minV) / range) * ch;
      const lc  = vals[vals.length - 1] >= 0 ? '#1a7f4b' : '#b91c1c';
      const gid = 'eqg-' + String(bot.magic || bot.id).replace(/\W/g,'');
      const ticks = [0, 0.25, 0.5, 0.75, 1].map(f => {
        const v = minV + range * f;
        return { v: Math.round(v), y: pad.top + yS(v) };
      });
      const gridLines = ticks.map(t =>
        '<line x1="' + pad.left + '" y1="' + t.y + '" x2="' + (pad.left+cw) + '" y2="' + t.y + '" stroke="var(--border,#e0e3e8)" stroke-width=".5" stroke-dasharray="3 3"/>' +
        '<text x="' + (pad.left-4) + '" y="' + (t.y+3) + '" text-anchor="end" font-size="8.5" fill="var(--text3,#9098a8)">' + (t.v>=0?'+':'') + t.v + '</text>'
      ).join('');
      const y0 = pad.top + yS(0);
      const polyPts = pts.map((p,i) => (pad.left+xS(i)) + ',' + (pad.top+yS(p.y))).join(' ');
      const areaD = 'M ' + (pad.left+xS(0)) + ',' + (pad.top+yS(pts[0].y)) + ' ' +
        pts.map((p,i) => 'L ' + (pad.left+xS(i)) + ',' + (pad.top+yS(p.y))).join(' ') +
        ' L ' + (pad.left+xS(pts.length-1)) + ',' + y0 + ' L ' + pad.left + ',' + y0 + ' Z';
      const stepX = Math.max(1, Math.floor(pts.length / 6));
      const xLabels = pts
        .filter((_, i) => i % stepX === 0 || i === pts.length - 1)
        .map(p => {
          const i = pts.indexOf(p);
          return '<text x="' + (pad.left+xS(i)) + '" y="' + (pad.top+ch+18) + '" text-anchor="middle" font-size="8.5" fill="var(--text3,#9098a8)">' + p.label + '</text>';
        }).join('');
      const finalVal = vals[vals.length - 1];
      const finalX   = pad.left + xS(pts.length - 1);
      const finalY   = pad.top  + yS(finalVal);
      const badge = '<text x="' + (finalX+4) + '" y="' + (finalY+4) + '" font-size="9" font-weight="700" fill="' + lc + '">' + (finalVal>=0?'+':'') + finalVal.toFixed(0) + '</text>';
      const svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block;overflow:visible">' +
        '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="' + lc + '" stop-opacity="0.18"/>' +
        '<stop offset="100%" stop-color="' + lc + '" stop-opacity="0.01"/>' +
        '</linearGradient></defs>' +
        gridLines +
        '<line x1="' + pad.left + '" y1="' + y0 + '" x2="' + (pad.left+cw) + '" y2="' + y0 + '" stroke="var(--border2,#c8cdd5)" stroke-width=".8"/>' +
        '<path d="' + areaD + '" fill="url(#' + gid + ')" stroke="none"/>' +
        '<polyline points="' + polyPts + '" fill="none" stroke="' + lc + '" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>' +
        xLabels + badge + '</svg>';
      tabOverview += '<div style="margin-bottom:14px"><div style="font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px">Equity Curve — Backtest SQX</div>' + svg + '</div>';
    })();
  }
  tabOverview += `<div style="font-size:11px;color:var(--text3);margin-bottom:6px">Pegá el Overview completo copiado desde SQX:</div>
    <textarea id="ov-${id}" rows="6" placeholder="TOTAL PROFIT&#10;$ 6038.41&#10;...&#10;MONTHLY PERFORMANCE ($)&#10;Year&#9;Jan&#9;Feb&#9;..." style="width:100%;font-size:11px;font-family:Consolas,monospace;border:1px solid var(--border2);border-radius:var(--radius);padding:8px;resize:vertical;background:var(--bg2)"></textarea>
    <button style="margin-top:6px" onclick="saveOverview('${id}')">💾 Parsear y guardar</button>`;

  // ── pestaña Pseudocódigo ──────────────────────────────────────────
  let tabPseudo;
  if (bot.pseudocodigo) {
    const psc = { botId: String(bot.magic||bot.id), parsed: parseSQXFile(bot.pseudocodigo), filename: bot.pseudocodigoData?.filename || '', aiExplanation: bot.pseudocodigoData?.aiExplanation || null };
    tabPseudo = buildPseudocodigoHTML(psc) +
      `<details style="margin-top:10px"><summary style="font-size:11px;color:var(--text3);cursor:pointer">📄 Ver pseudocódigo raw</summary><pre class="pseudo-block" style="margin-top:6px">${bot.pseudocodigo.replace(/</g,'&lt;')}</pre></details>`;
  } else {
    tabPseudo = `<div style="font-size:12px;color:var(--text3)">Sin pseudocódigo cargado. Usá "Scan Pseudocódigos".</div>`;
  }

  return `
    <div class="dtab-bar">
      <button class="dtab-btn active" onclick="switchDTab('${id}','overview',this)">📋 Overview</button>
      <button class="dtab-btn"        onclick="switchDTab('${id}','pseudo',this)">📝 Pseudocódigo</button>
    </div>
    <div id="dtab-${id}-overview" class="dtab-panel active">${tabOverview}</div>
    <div id="dtab-${id}-pseudo"   class="dtab-panel">${tabPseudo}</div>
  `;
}

async function generateAIExplanation(rawText) {
  const apiKey = localStorage.getItem('anthropic_key');
  if (!apiKey) { alertErr('Configurá tu Anthropic API Key primero (botón 🔑 API Key)'); return null; }
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-haiku-4-5-20251001',
      max_tokens: 500,
      messages: [{ role: 'user', content: `Sos un analista de trading algorítmico. Leé este pseudocódigo de StrategyQuant X y explicá en español, con narrativa simple y directa, POR QUÉ esta estrategia ejecuta una entrada.\n\nNo listes condiciones técnicas en forma de lista. Escribí 3-5 oraciones corridas como si se lo explicaras a un trader que quiere entender el comportamiento sin ser programador. Usá frases como "espera que el mercado...", "entra cuando...", "la lógica detrás es...", "sale si...". Enfocate en el trasfondo y la intuición de la señal, no en la sintaxis.\n\nPseudocódigo:\n${rawText}` }]
    })
  });
  if (!resp.ok) throw new Error(`Claude API: ${resp.status}`);
  const data = await resp.json();
  return data.content[0].text.trim();
}

  const bot = DB.find(b => String(b.magic||b.id) === botId);

// ─── Pseudocódigo: parse + render ────────────────────────────────────
function parseSQXFile(text) {
  const na = 'No especificado';
  const r = { entradaTipo:na, ordenTipo:na, indicadores:na, filtros:na, sesion:na, stopLoss:na, takeProfit:na, moneyManagement:na, condicionesLong:[], condicionesShort:[], timeframe:na };

  const tfM = text.match(/backtested\s+on\s+\S+\s*\/\s*(M1|M5|M15|M30|H1|H2|H4|H6|H8|D1|W1|MN)\b/i)
           || text.match(/\btimeframe\s*(?:\([^)]*\))?\s*[:=]\s*(M1|M5|M15|M30|H1|H2|H4|H6|H8|D1|W1|MN)\b/i)
           || text.match(/data\s+series[^\n]*\(\s*(M1|M5|M15|M30|H1|H2|H4|H6|H8|D1|W1|MN)\s*[,)]/i);
  if (tfM) r.timeframe = tfM[1].toUpperCase();

  const vars = {};
  for (const m of text.matchAll(/(?:int|double|bool)\s+(\w+)\s*=\s*([^;\n]+)/gi))
    vars[m[1].trim()] = m[2].trim();
  const resolveVars = s => s.replace(/\b([A-Za-z_]\w*)\b/g, k => vars[k] ?? k);
  const cleanExpr = s => s.replace(/Main\s+chart,?\s*/gi,'').replace(/\s+/g,' ').trim();

  const longM  = text.match(/LongEntrySignal\s*=\s*([\s\S]*?);/i);
  const shortM = text.match(/ShortEntrySignal\s*=\s*([\s\S]*?);/i);
  const longExpr  = longM  ? longM[1].trim()  : 'false';
  const shortExpr = shortM ? shortM[1].trim() : 'false';
  const isFalseExpr = s => /^\(?\s*false(\s+and\s+false)*\s*\)?$/i.test(s.replace(/\s+/g,' ').trim());
  const orderBlocks = getOrderBlocks(text);
  const hasLongOrder  = 'Long'  in orderBlocks;
  const hasShortOrder = 'Short' in orderBlocks;
  const hasLong  = hasLongOrder  || (!isFalseExpr(longExpr)  && !hasShortOrder);
  const hasShort = hasShortOrder || (!isFalseExpr(shortExpr) && !hasLongOrder);

  if (hasLong && hasShort) r.entradaTipo = 'Both (Buy + Sell)';
  else if (hasLong)        r.entradaTipo = 'Buy (Long)';
  else if (hasShort)       r.entradaTipo = 'Sell (Short)';

  function splitAnd(expr) {
    const parts = []; let depth = 0, buf = '';
    const s = expr.replace(/^\s*\(+|\)+\s*;?\s*$/g,'');
    for (let i = 0; i < s.length; i++) {
      if (s[i]==='(') { depth++; buf+=s[i]; }
      else if (s[i]===')') { depth--; buf+=s[i]; }
      else if (depth===0 && /^and\b/i.test(s.slice(i))) {
        const p = buf.trim().replace(/^\(+|\)+$/g,'').trim();
        if (p.length>3) parts.push(cleanExpr(p));
        buf=''; i+=2;
      } else buf+=s[i];
    }
    const last = buf.trim().replace(/^\(+|\)+$/g,'').trim();
    if (last.length>3) parts.push(cleanExpr(last));
    return parts;
  }

  r.condicionesLong  = hasLong  ? splitAnd(longExpr)  : [];
  r.condicionesShort = hasShort ? splitAnd(shortExpr) : [];

  const entryType = formatEntryTypes(orderBlocks);
  if (entryType) r.ordenTipo = entryType;

  const sessM = text.match(/LimitSignalsTimeRange\s*=\s*true\s*\((\d{2,4})\s*-\s*(\d{2,4})/i);
  if (sessM) {
    const fmt = t => `${t.padStart(4,'0').slice(0,2)}:${t.padStart(4,'0').slice(2)}`;
    r.sesion = `${fmt(sessM[1])} – ${fmt(sessM[2])}`;
  }

  const slM = text.match(/Stop\s+Loss\s*=\s*([^;\n]+)/i);
  if (slM) r.stopLoss = cleanExpr(resolveVars(slM[1]));

  const tsM = text.match(/Trailing\s+Stop\s*=\s*([^;\n]+)/i);
  if (tsM) { const ts = cleanExpr(resolveVars(tsM[1])); r.stopLoss = r.stopLoss !== na ? `${r.stopLoss} + Trailing ${ts}` : `Trailing: ${ts}`; }

  const tpM = text.match(/(?:Take\s+Profit|Profit\s+Target)\s*=\s*([^;\n]+)/i);
  if (tpM) r.takeProfit = cleanExpr(resolveVars(tpM[1]));

  const exitM = text.match(/Exit\s+After\s+(\w+)\s+bars/i);
  if (exitM) { const bars = resolveVars(exitM[1]); const exitStr = `Máx. ${bars} barras`; r.takeProfit = r.takeProfit !== na ? `${r.takeProfit} / ${exitStr}` : exitStr; }

  const mmM = text.match(/(?:Fixed\s+)?lot\s+size\s*[=:]\s*([^\n;]+)/i) || text.match(/risk\s*(?:per\s+trade)?\s*[=:]\s*([^\n;]+)/i);
  if (mmM) r.moneyManagement = mmM[1].trim();

  const IND_SKIP = /^(Open|Close|High|Low|Volume|True|False|And|Or|Not|Main|Exit|Enter|Signal|Order|Trade|Stop|Limit|Market|Long|Short|Buy|Sell|GetValue|SetValue|Print|Log|Alert|Return|If|Then|Else|End|Begin|Var|Int|Double|Bool|String)$/i;
  const indPat = /\b([A-Z][A-Za-z]{2,})\s*\([^)]{1,120}\)/g;
  const indNames = [...new Set([...text.matchAll(indPat)].map(m => m[1]).filter(name => !IND_SKIP.test(name)))];
  if (indNames.length) {
    r.indicadores = indNames.slice(0, 10).map(name => {
      const call = text.match(new RegExp(`\\b${name}\\s*\\([^)]+\\)`, 'i'));
      return call ? cleanExpr(call[0]) : name;
    }).join(' | ');
  }

  const allConds = [...r.condicionesLong, ...r.condicionesShort];
  if (allConds.length) r.filtros = [...new Set(allConds)].slice(0,6).join(' | ');

  return r;
}

function buildEntradaExplanation(p) {
  const na = 'No especificado';
  const clean = s => s
    .replace(/\[1\]/g, ' (barra anterior)')
    .replace(/\[(\d+)\]/g, (_, n) => ` (hace ${n} barras)`)
    .replace(/\bfor\s+(\d+)\s+bars\b/gi, 'durante $1 barras consecutivas')
    .replace(/\bis\s+lower\s+than\b/gi, '<')
    .replace(/\bis\s+higher\s+than\b/gi, '>')
    .replace(/\s+/g,' ').trim();

  const parts = [];
  const dirs = { 'Both (Buy + Sell)':'en ambas direcciones (Long y Short)', 'Buy (Long)':'solo en Long (compras)', 'Sell (Short)':'solo en Short (ventas)' };
  const dirTxt = dirs[p.entradaTipo];
  const ordTxt = p.ordenTipo !== na ? `, con órdenes a ${p.ordenTipo}` : '';
  if (dirTxt) parts.push(`Opera ${dirTxt}${ordTxt}.`);

  if (p.condicionesLong?.length) {
    const items = p.condicionesLong.map((c,i)=>`<strong>(${i+1})</strong> ${clean(c)}`).join('<br>');
    parts.push(`<em>Entrada Long</em> — se dispara cuando se cumplen todas:<br>${items}`);
  }
  if (p.condicionesShort?.length) {
    const items = p.condicionesShort.map((c,i)=>`<strong>(${i+1})</strong> ${clean(c)}`).join('<br>');
    parts.push(`<em>Entrada Short</em> — se dispara cuando se cumplen todas:<br>${items}`);
  }
  if (!p.condicionesLong?.length && !p.condicionesShort?.length && p.indicadores !== na)
    parts.push(`Señal basada en: ${p.indicadores}.`);

  if (p.sesion !== na) parts.push(`Horario operativo: ${p.sesion}.`);

  const exits = [];
  if (p.stopLoss !== na)   exits.push(`Stop Loss: ${p.stopLoss}`);
  if (p.takeProfit !== na) exits.push(`Salida: ${p.takeProfit}`);
  if (exits.length) parts.push(exits.join(' — '));

  if (p.moneyManagement !== na) parts.push(`Sizing: ${p.moneyManagement}.`);

  return parts.length ? parts.join('<br><br>') : 'No se detectaron condiciones. Verificá que el archivo sea un Pseudo Source Code exportado desde SQX.';
}

  const card = (lbl, val) => `<div class="kpi-sm"><div class="kpi-sm-lbl">${lbl}</div><div class="kpi-sm-val" style="font-size:12px;font-weight:600;color:${val===na?'var(--text3)':'var(--text)'};white-space:normal;line-height:1.4">${val}</div></div>`;

function parseSQXOverview(text) {
  const lines = text.split('\n').map(l => l.trim());
  const flat  = lines.join('\n');

  function extractNum(label) {
    const re = new RegExp(label + '[^\\d\\-]*([\\-\\d\\.]+)', 'i');
    const m = flat.match(re);
    return m ? parseFloat(m[1]) : null;
  }

  const metrics = {
    totalProfit:    extractNum('TOTAL PROFIT'),
    trades:         extractNum('# OF TRADES'),
    pf:             extractNum('PROFIT FACTOR'),
    dd:             extractNum('DRAWDOWN\\n\\$'),
    ddPct:          extractNum('% DRAWDOWN'),
    wr:             extractNum('WINNING PERCENTAGE'),
    sharpe:         extractNum('SHARPE RATIO'),
    cagr:           extractNum('CAGR'),
    retdd:          extractNum('RETURN / DD RATIO'),
    yearlyAvgPct:   extractNum('YEARLY AVG % RETURN'),
    sqn:            extractNum('SQN SCORE'),
  };

  // Tabla mensual
  const monthlyData = [];
  const monthlyIdx = lines.findIndex(l => l.includes('MONTHLY PERFORMANCE'));
  if (monthlyIdx >= 0) {
    // buscar fila header Year Jan Feb ...
    let headerIdx = -1;
    for (let i = monthlyIdx; i < Math.min(monthlyIdx + 5, lines.length); i++) {
      if (lines[i].toLowerCase().includes('year') && lines[i].toLowerCase().includes('jan')) {
        headerIdx = i; break;
      }
    }
    if (headerIdx >= 0) {
      for (let i = headerIdx + 1; i < lines.length; i++) {
        const cols = lines[i].split('\t');
        if (!cols[0] || !/^\d{4}$/.test(cols[0].trim())) break;
        const year = parseInt(cols[0]);
        const months = [];
        for (let m = 1; m <= 12; m++) {
          const v = parseFloat(cols[m]);
          months.push(isNaN(v) ? null : v === 0 ? null : v);
        }
        const ytd = parseFloat(cols[13]);
        monthlyData.push({ year, months, ytd: isNaN(ytd) ? null : ytd });
      }
    }
  }

  return { metrics, monthlyData };
}

async function saveOverview(id) {
  const ta = document.getElementById('ov-' + id);
  if (!ta || !ta.value.trim()) return;
  const parsed = parseSQXOverview(ta.value);
  if (!parsed.monthlyData.length) { alertErr('No se encontró la tabla mensual. Asegurate de copiar el Overview completo desde SQX.'); return; }
  const bot = DB.find(b => String(b.magic || b.id) === id);
  if (!bot) return;
  bot.overviewData = parsed;
  if (sb.isAuthenticated()) {
    try { await sb.upsertBot(bot); setSyncStatus('✓ Overview guardado', '#1a7f4b'); setTimeout(() => setSyncStatus('',''), 3000); }
    catch(e) { alertErr('Error al guardar: ' + e.message); return; }
  }
  alertOk(`✓ Overview guardado — ${parsed.monthlyData.length} años, métricas extraídas.`);
  render();
}

async function deleteAllBots() {

// ─── Scan SQX ────────────────────────────────────────────────────────
async function handleScanSQX(files) {
  const csvFiles = [...files].filter(f => f.name.toLowerCase().endsWith('.csv'));
  if (!csvFiles.length) { alertErr('No se encontraron archivos .csv en la carpeta.'); return; }

  const allBots = (await Promise.all(csvFiles.map(file => new Promise(resolve => {
    const rd = new FileReader();
    rd.onload = e => {
      try {
        const firstLine = (e.target.result||'').split('\n')[0];
        if (firstLine.includes('Magic Number')) { resolve([]); return; }
        resolve(parseCSV(e.target.result).map(b => ({ ...b, _mtime: file.lastModified })));
      } catch { resolve([]); }
    };
    rd.onerror = () => resolve([]);
    rd.readAsText(file, 'UTF-8');
  })))).flat();

  const byMagic = {};
  allBots.forEach(b => {
    const k = String(b.magic || b.id);
    if (!byMagic[k] || b._mtime > byMagic[k]._mtime) byMagic[k] = b;
  });

  const _nN = n => { const r = (n||'').toLowerCase().replace(/[^a-z0-9]/g,''); return r.startsWith('wfm') ? r.slice(3) : r; };
  const applyMerge = (existing, s) => {
    existing.is = s.is; existing.oos = s.oos; existing.sqxFilter = s.sqxFilter;
    existing.standalone = s.standalone;
    existing.symbol = existing.symbol || s.symbol;
    existing.tf = existing.tf || s.tf;
    existing.source = 'csv';
  };
  let added = 0, updated = 0;
  Object.values(byMagic).forEach(s => {
    const sNorm = _nN(s.name);
    const magicM = s.magic ? DB.find(x => x.magic && String(x.magic) === String(s.magic)) : null;
    if (magicM) { applyMerge(magicM, s); updated++; return; }
    const exactM = DB.find(x => x.name === s.name);
    if (exactM) { applyMerge(exactM, s); updated++; return; }
    const fuzzyM = DB.find(x => { const xN = _nN(x.name); return xN === sNorm || xN.startsWith(sNorm) || sNorm.startsWith(xN); });
    if (fuzzyM) { applyMerge(fuzzyM, s); updated++; return; }
    const { _mtime, ...clean } = s;
    DB.push(clean); added++;
  });

  populateFilters();
  renderTable();

  if (sb.isAuthenticated()) {
    try {
      await sb.upsertBots(DB);
      setSyncStatus('✓ Guardado en Supabase', '#1a7f4b');
      setTimeout(() => setSyncStatus('', ''), 4000);
    } catch(e) { console.warn('scanSQX: upsert failed', e.message); }
  }
  alertOk(`✓ Scan SQX — ${Object.keys(byMagic).length} bot(s) leídos, ${added} nuevo(s), ${updated} actualizado(s).`);
}

// ─── Scan Pseudocódigos ───────────────────────────────────────────────
async function handleScanPseudo(files) {
  const txtFiles = [...files].filter(f => f.name.toLowerCase().endsWith('.txt'));
  if (!txtFiles.length) { alertErr('No se encontraron archivos .txt en la carpeta.'); return; }

  const allItems = (await Promise.all(txtFiles.map(file => new Promise(resolve => {
    const rd = new FileReader();
    rd.onload = e => {
      const magic = file.name.replace(/\.txt$/i,'').split('_')[0].replace(/\D/g,'');
      resolve(magic ? { magic, text: e.target.result||'', filename: file.name, mtime: file.lastModified } : null);
    };
    rd.onerror = () => resolve(null);
    rd.readAsText(file, 'UTF-8');
  })))).filter(Boolean);

  const byMagic = {};
  allItems.forEach(item => { if (!byMagic[item.magic] || item.mtime > byMagic[item.magic].mtime) byMagic[item.magic] = item; });

  let matched = 0, unmatched = 0;
  Object.values(byMagic).forEach(({ magic, text, filename }) => {
    const bot = DB.find(b => String(b.magic) === magic || String(b.id) === magic);
    if (!bot) { unmatched++; return; }
    bot.pseudocodigo = text;
    bot.pseudocodigoData = { ...(bot.pseudocodigoData||{}), filename, text };
    matched++;
  });

  if (matched === 0) { alertErr(`Sin match — ${Object.keys(byMagic).length} .txt leídos, ninguno coincide con bots en DB.`); return; }

  renderTable();
  if (sb.isAuthenticated()) {
    try {
      await sb.upsertBots(DB);
      setSyncStatus('✓ Guardado en Supabase', '#1a7f4b');
      setTimeout(() => setSyncStatus('', ''), 4000);
    } catch(e) { console.warn('scanPseudo: upsert failed', e.message); }
  }
  alertOk(`✓ Pseudocódigos — ${matched} bot(s) actualizado(s)${unmatched ? ', ' + unmatched + ' sin match' : ''}.`);
}

// ─── Importar overview_backup.json ───────────────────────────────────
async function handleImportOverview(files) {
  if (!files.length) return;
  let json;
  try { json = JSON.parse(await files[0].text()); }
  catch(e) { alertErr('JSON inválido: ' + e.message); return; }

  const entries = Object.entries(json);
  if (!entries.length) { alertErr('Archivo vacío'); return; }

  const byMagic = {};
  DB.forEach(b => { if (b.magic != null) byMagic[String(b.magic)] = b; });

  let matched = 0, missed = 0;
  const toUpsert = [];
  for (const [magic, overviewData] of entries) {
    const bot = byMagic[magic];
    if (!bot) { missed++; continue; }
    bot.overviewData = overviewData;
    matched++;
    toUpsert.push(bot);
  }

  if (toUpsert.length) {
    try { await sb.upsertBots(toUpsert); }
    catch(e) { alertErr('Error al guardar: ' + e.message); return; }
  }

  renderTable();
  alertOk(`✓ Overview importado — ${matched} bot(s) actualizados, ${missed} sin match.`);
}

// ─── parseCSV + splitLine ─────────────────────────────────────────────
function splitLine(line, sep) {
  const r = []; let cur = '', inQ = false;
  for (const ch of line) {
    if (ch === '"') { inQ = !inQ; cur += ch; }
    else if (ch === sep && !inQ) { r.push(cur); cur = ''; }
    else cur += ch;
  }
  r.push(cur); return r;
}
const SQX_COL_KEYS = {
  'profit factor':'pf','net profit':'np','# of trades':'trades',
  'sharpe ratio':'sharpe','annual % return':'cagr','stability':'stability',
  'drawdown':'dd','win/loss ratio':'wr','ret/dd ratio':'retdd',
  'cagr/max dd %':'cagrdd','fitness':'fitness','exposure':'exposure',
  'r expectancy':'rexp','sqn':'sqn','stagnation':'stag','z-score probability':'zp',
  'max dd':'max_dd_pct','winning percent':'winning_percent',
  'entry indicators':'entry_indicators','entry indicator':'entry_indicators','complexity':'complexity',
};
const SQX_SKIP_STANDALONE = new Set([
  'Strategy Name','Filters result','Symbol (IS)','TimeFrame (IS)',
  'Mini equity chart (IS)','Mini equity chart (OOS)',
]);
function _colKey(header) {
  const low = header.toLowerCase().trim();
  for (const [pattern, key] of Object.entries(SQX_COL_KEYS)) {
    if (low.includes(pattern)) return key;
  }
  return low.replace(/[^a-z0-9]/g,'_').replace(/_+/g,'_').replace(/^_|_$/g,'');
}
function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) throw new Error('Archivo vacío.');
  const sep = lines[0].includes(';') ? ';' : ',';
  const headers = lines[0].split(sep).map(h => h.replace(/"/g,'').trim());
  const col = name => headers.indexOf(name);
  const iName = col('Strategy Name'), iFilter = col('Filters result');
  const iSym  = col('Symbol (IS)'),   iTf = col('TimeFrame (IS)');
  if (iName === -1) throw new Error('No parece un Databank CSV de SQX.');
  const isColumns = [], oosColumns = [], standaloneColumns = [];
  headers.forEach((h, i) => {
    if (h.endsWith('(IS)'))  isColumns.push({ i, key: _colKey(h.replace(/\s*\(IS\)\s*$/,'')) });
    else if (h.endsWith('(OOS)')) oosColumns.push({ i, key: _colKey(h.replace(/\s*\(OOS\)\s*$/,'')) });
    else if (!SQX_SKIP_STANDALONE.has(h) && i !== iName && i !== iFilter) standaloneColumns.push({ i, key: _colKey(h) });
  });
  return lines.slice(1).filter(l => l.trim()).map(line => {
    const cols = splitLine(line, sep);
    const g = i => (i >= 0 && cols[i] !== undefined) ? cols[i].replace(/"/g,'').trim() : '';
    const n = i => { const v = parseFloat(g(i)); return isNaN(v) ? null : v; };
    const nameStr = g(iName), symRaw = g(iSym), magicStr = nameStr.replace(/\D/g,'');
    const isObj = {}, oosObj = {}, standaloneObj = {};
    isColumns.forEach(({i,key})  => { isObj[key]  = n(i); });
    oosColumns.forEach(({i,key}) => { oosObj[key] = n(i); });
    standaloneColumns.forEach(({i,key}) => {
      const raw = g(i); const num = parseFloat(raw);
      standaloneObj[key] = isNaN(num) ? (raw||null) : num;
    });
    return {
      id: magicStr || (Date.now().toString(36)+Math.random().toString(36).slice(2)),
      magic: magicStr ? Number(magicStr) : null,
      name: nameStr, symbol: symRaw.split('_')[0]||symRaw,
      tf: g(iTf), sqxFilter: g(iFilter), source: 'csv',
      added: new Date().toISOString().slice(0,10), notes: '',
      sqn: isObj.sqn??oosObj.sqn??null, stag: isObj.stag??oosObj.stag??null, zp: isObj.zp??oosObj.zp??null,
      is: isObj, oos: oosObj, standalone: standaloneObj,
    };
  });
}

// ─── Preferencias ─────────────────────────────────────────────────────
function collectPrefs() {
  return {
    filterMode,
    sortCol,
    sortDir,
    symbol: document.getElementById('f-symbol')?.value || '',
    tf:     document.getElementById('f-tf')?.value     || '',
    dir:    document.getElementById('f-dir')?.value    || '',
  };
}
function applyPrefs(p) {
  if (!p) return;
  if (p.filterMode) {
    filterMode = p.filterMode;
    ['all','passed','failed'].forEach(m => document.getElementById('f-' + m)?.classList.toggle('active', m === filterMode));
  }
  if (p.sortCol) sortCol = p.sortCol;
  if (p.sortDir) sortDir = p.sortDir;
  if (p.symbol) { const s = document.getElementById('f-symbol'); if (s) s.value = p.symbol; }
  if (p.tf)     { const s = document.getElementById('f-tf');     if (s) s.value = p.tf; }
  if (p.dir)    { const s = document.getElementById('f-dir');    if (s) s.value = p.dir; }
}
async function persistPrefs() {
  if (sb.isAuthenticated()) await sb.savePrefs(collectPrefs()).catch(() => {});
}

// ─── Init ─────────────────────────────────────────────────────────────
async function init() {
  if (typeof sb === 'undefined' || !sb.isAuthenticated()) { window.location.href = 'index.html'; return; }
  updateApiKeyBtn();
  setSyncStatus('Cargando...', '');
  try {
    const [bots, prefs] = await Promise.all([sb.getBots(), sb.getPrefs()]);
    DB = bots;
    populateFilters();
    applyPrefs(prefs);
    renderTable();
    setSyncStatus(DB.length + ' bots cargados', '#1a7f4b');
    setTimeout(() => setSyncStatus('', ''), 3000);
  } catch(e) {
    setSyncStatus('Error al cargar', '#b91c1c');
    alertErr('Error cargando bots: ' + e.message);
  }
  // deep-link desde estacionalidad: sqx.html?bot=<magic>
  const _dpBot = new URLSearchParams(window.location.search).get('bot');
  if (_dpBot) {
    const _dpId = _dpBot;
    const _tryOpen = () => {
      const tr = document.querySelector(`tr[data-id="${_dpId}"]`);
      if (tr) {
        tr.scrollIntoView({ behavior: 'smooth', block: 'center' });
        toggleDetail(_dpId);
      }
    };
    // Esperar a que los bots carguen si aún no están renderizados
    if (document.querySelector('tr[data-id]')) {
      _tryOpen();
    } else {
      const _obs = new MutationObserver(() => {
        if (document.querySelector('tr[data-id]')) {
          _obs.disconnect();
          _tryOpen();
        }
      });
      _obs.observe(document.getElementById('table-container') || document.body, { childList: true, subtree: true });
    }
  }
}
document.addEventListener('DOMContentLoaded', init);
window.addEventListener('beforeunload', persistPrefs);
