<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MT5 — Trades Live</title>
<script src="supabase.js"></script>
<script src="sidebar.js"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#ffffff;--bg2:#f8f9fa;--bg3:#f1f3f5;--border:#e0e3e8;--border2:#c8cdd5;
  --text:#111318;--text2:#4a5060;--text3:#9098a8;
  --green:#1a7f4b;--green-bg:#eaf7f0;--green-border:#b2dfc8;
  --red:#b91c1c;--red-bg:#fef2f2;--red-border:#fcc;
  --amber:#92400e;--amber-bg:#fffbeb;--amber-border:#fde68a;
  --accent:#4f46e5;--accent-light:#eef2ff;
  --radius:6px;--radius-lg:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5}

.page-topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid var(--border);background:var(--bg);gap:12px;flex-wrap:wrap}
.page-topbar h1{font-size:15px;font-weight:700;letter-spacing:-0.2px}
.page-topbar .sub{font-size:12px;color:var(--text3);margin-top:1px}
.topbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

button{height:32px;padding:0 14px;border-radius:var(--radius);font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border2);background:var(--bg);color:var(--text2);transition:all 0.12s;font-family:inherit}
button:hover{background:var(--bg3);color:var(--text);border-color:#adb5bd}

.filters-bar{display:flex;align-items:center;gap:8px;padding:8px 24px;border-bottom:1px solid var(--border);flex-wrap:wrap;background:var(--bg)}
.filter-label{font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:0.4px}
select.filter-sel{height:26px;padding:0 8px;border:1px solid var(--border2);border-radius:var(--radius);font-size:12px;background:var(--bg);color:var(--text2);font-family:inherit}
.filter-count{margin-left:auto;font-size:11px;color:var(--text3)}

.table-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:clip;margin:16px 24px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{background:var(--bg2);padding:8px 10px;text-align:right;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap;border-bottom:1px solid var(--border);cursor:pointer;user-select:none}
thead th:hover{color:var(--text2);background:var(--bg3)}
thead th.left{text-align:left}
tbody tr{border-bottom:1px solid var(--border);cursor:pointer}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--bg2)}
tbody tr.expanded{background:var(--accent-light)}
td{padding:8px 10px;text-align:right;color:var(--text2);white-space:nowrap}
td.left{text-align:left;color:var(--text);font-weight:600}
td.spark{text-align:center;padding:4px 10px}

.pass{color:var(--green)!important;font-weight:600}
.fail{color:var(--red)!important;font-weight:600}
.warn{color:#d97706!important;font-weight:600}
.na{color:var(--text3)!important}

.detail-row td{padding:0!important;white-space:normal}
.detail-inner{padding:20px 24px;border-top:2px solid var(--accent-light);background:var(--bg)}
.detail-title{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}

.trade-table{width:100%;border-collapse:collapse;font-size:12px}
.trade-table th{background:var(--bg2);border-bottom:1px solid var(--border);padding:6px 10px;text-align:left;white-space:nowrap;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.4px}
.trade-table td{padding:6px 10px;border-bottom:1px solid var(--border);white-space:nowrap;font-size:12px;color:var(--text2)}
.trade-table tr:last-child td{border-bottom:none}
.trade-p{color:var(--green)!important;font-weight:600}.trade-n{color:var(--red)!important;font-weight:600}

.equity-svg{display:block;width:100%;height:64px;margin-top:8px}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:var(--radius);font-size:13px;font-weight:500;z-index:999;display:none;max-width:500px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.toast-ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.toast-err{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.empty-state{text-align:center;padding:60px 20px;color:var(--text3);font-size:13px}
</style>
</head>
<body>
<div id="toast-ok" class="toast toast-ok"></div>
<div id="toast-err" class="toast toast-err"></div>

<div class="page-topbar">
  <div>
    <h1>📉 MT5 — Trades Live</h1>
    <div id="sync-status" style="font-size:12px;color:var(--text3);margin-top:2px">Cargando...</div>
  </div>
  <div class="topbar-right">
    <button onclick="loadData()">↻ Actualizar</button>
  </div>
</div>

<div class="filters-bar">
  <span id="acct-wrap" style="display:none;align-items:center;gap:6px">
    <span class="filter-label">Cuenta:</span>
    <select class="filter-sel" id="f-account" onchange="applyFilters()"><option value="">Todas</option></select>
  </span>
  <span style="display:flex;align-items:center;gap:6px">
    <span class="filter-label">Symbol:</span>
    <select class="filter-sel" id="f-symbol" onchange="applyFilters()"><option value="">Todos</option></select>
  </span>
  <span class="filter-count" id="f-count"></span>
</div>

<div class="table-card">
<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th class="left" onclick="sortBy('name')">Bot<span id="s-name"></span></th>
        <th class="left" onclick="sortBy('symbol')">Symbol<span id="s-symbol"></span></th>
        <th onclick="sortBy('magic')">Magic<span id="s-magic"></span></th>
        <th class="left" onclick="sortBy('account')">Cuenta<span id="s-account"></span></th>
        <th onclick="sortBy('trades')">Trades<span id="s-trades"></span></th>
        <th onclick="sortBy('pf')">PF<span id="s-pf"> ▼</span></th>
        <th onclick="sortBy('dd')">DD%<span id="s-dd"></span></th>
        <th onclick="sortBy('wr')">WR%<span id="s-wr"></span></th>
        <th onclick="sortBy('netProfit')">Net P&amp;L<span id="s-netProfit"></span></th>
        <th class="spark">Equity</th>
      </tr>
    </thead>
    <tbody id="mt5-tbody"></tbody>
  </table>
</div>
</div>

<!-- ═══ IMPORTADOR HISTORIAL MANUAL ═══════════════════════════════════ -->
<div style="margin:8px 24px 0">
  <button id="btn-importer-toggle" onclick="toggleImporter()" style="font-size:11px;color:var(--text3);border:1px dashed var(--border2);background:transparent">
    ▶ Importar historial manual
  </button>
</div>

<div id="importer-panel" style="display:none;margin:8px 24px 24px;border:1px solid var(--border2);border-radius:var(--radius-lg);background:var(--bg2);padding:20px">
  <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:16px">
    Importar historial manual — MyFxBook
  </div>

  <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px">
    <div>
      <div style="font-size:11px;color:var(--text3);margin-bottom:4px">Bot</div>
      <select id="imp-bot" style="height:30px;padding:0 8px;border:1px solid var(--border2);border-radius:var(--radius);font-size:12px;background:var(--bg);min-width:260px">
        <option value="">— seleccioná un bot —</option>
      </select>
    </div>
    <div>
      <div style="font-size:11px;color:var(--text3);margin-bottom:4px">Cuenta</div>
      <select id="imp-account" style="height:30px;padding:0 8px;border:1px solid var(--border2);border-radius:var(--radius);font-size:12px;background:var(--bg)">
        <option value="">— seleccioná cuenta —</option>
      </select>
    </div>
    <div>
      <div style="font-size:11px;color:var(--text3);margin-bottom:4px">Capital base (USD)</div>
      <input id="imp-capital" type="number" value="10000" min="1"
        style="height:30px;padding:0 8px;border:1px solid var(--border2);border-radius:var(--radius);font-size:12px;background:var(--bg);width:110px">
    </div>
  </div>

  <div style="margin-bottom:14px">
    <div style="font-size:11px;color:var(--text3);margin-bottom:4px">Pegá las filas de MyFxBook (con header)</div>
    <textarea id="imp-raw" rows="6" placeholder="Magía&#9;Fecha de apertura&#9;Fecha de cierre&#9;Símbolo&#9;Acción&#9;Lotes&#9;SL (Precio)&#9;TP (Precio)&#9;Precio de apertura&#9;Precio de cierre&#9;Pips&#9;Beneficio neto&#9;Swap&#9;Comisiones..."
      style="width:100%;padding:8px;border:1px solid var(--border2);border-radius:var(--radius);font-size:11px;font-family:monospace;resize:vertical;background:var(--bg)"></textarea>
  </div>

  <button onclick="impParse()" style="background:var(--accent);color:#fff;border-color:var(--accent);margin-bottom:16px">
    Parsear y previsualizar
  </button>

  <div id="imp-preview" style="display:none">
    <div id="imp-preview-title" style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px"></div>
    <div style="overflow-x:auto;margin-bottom:14px">
      <table class="trade-table" id="imp-preview-table">
        <thead><tr>
          <th>Apertura</th><th>Cierre</th><th>Symbol</th><th>Tipo</th>
          <th>Lots</th><th>Open</th><th>Close</th><th>SL</th><th>TP</th>
          <th>Profit</th><th>Swap</th><th>Comisión</th>
        </tr></thead>
        <tbody id="imp-preview-tbody"></tbody>
      </table>
    </div>
    <div id="imp-warn" style="font-size:11px;color:var(--amber);margin-bottom:10px"></div>
    <button id="imp-confirm-btn" onclick="impConfirm()" style="background:var(--green);color:#fff;border-color:var(--green)"></button>
  </div>
</div>
<!-- ═══════════════════════════════════════════════════════════════════ -->

<script>
var _allTrades = [];
var _botsByMagic = {};
var LIVE = {};
var sortCol = 'pf', sortDir = -1;
var expandedMagic = null;

// ─── Helpers ────────────────────────────────────────────────────────
function authLogout() { if (typeof sb !== 'undefined') sb.signOut(); window.location.href = 'index.html'; }

function alertOk(m) {
  const e = document.getElementById('toast-ok');
  e.textContent = m; e.style.display = 'block';
  document.getElementById('toast-err').style.display = 'none';
  clearTimeout(e._t); e._t = setTimeout(() => e.style.display = 'none', 6000);
}
function alertErr(m) {
  const e = document.getElementById('toast-err');
  e.textContent = m; e.style.display = 'block';
  document.getElementById('toast-ok').style.display = 'none';
}
function setSyncStatus(msg, color) {
  const el = document.getElementById('sync-status');
  el.textContent = msg; el.style.color = color || 'var(--text3)';
}
function fmt(v, dec) {
  if (v === null || v === undefined) return '—';
  return Number(v).toFixed(dec ?? 2);
}
function pfColor(v)  { return v==null?'na': v>=1.30?'pass': v>=1.20?'warn':'fail'; }
function ddColor(v)  { return v==null?'na': v<=10  ?'pass': v<=20  ?'warn':'fail'; }
function wrColor(v)  { return v==null?'na': v>=55  ?'pass': v>=45  ?'warn':'fail'; }
function npColor(v)  { return v==null?'na': v>0    ?'pass':          'fail'; }

// ─── Sparkline SVG (80×30) ───────────────────────────────────────────
function sparkline(tradeList) {
  if (!tradeList || tradeList.length < 2) return '<span style="color:var(--text3);font-size:11px">—</span>';
  const pts = tradeList.map(t => t.cumProfit);
  const minY = Math.min(...pts), maxY = Math.max(...pts);
  const rangeY = maxY - minY || 1, n = pts.length - 1;
  const coords = pts.map((y, i) =>
    (i / (n||1) * 80).toFixed(1) + ',' + ((1 - (y - minY) / rangeY) * 28 + 1).toFixed(1)
  ).join(' ');
  const color = pts[pts.length-1] >= 0 ? '#1a7f4b' : '#b91c1c';
  return `<svg width="80" height="30" viewBox="0 0 80 30" style="display:block;margin:0 auto">` +
    `<polyline points="${coords}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}

// ─── Equity curve SVG con ejes X/Y ───────────────────────────────────
function equityCurve(tradeList) {
  if (!tradeList || tradeList.length < 2) return '';
  const BASE = 10000;
  const PL = 48, PB = 24, PT = 8, PR = 10;
  const W = 620, H = 120;
  const cW = W - PL - PR, cH = H - PT - PB;

  const pts   = tradeList.map(t => t.cumProfit);
  const pcts  = pts.map(v => v / BASE * 100);
  const tDates = tradeList.map(t => t.closeDate ? t.closeDate.slice(0,10) : '');
  const minP = Math.min(0, ...pcts), maxP = Math.max(0, ...pcts);
  const rangeP = maxP - minP || 1;
  const n = pts.length - 1;
  const color   = pcts[pcts.length-1] >= 0 ? '#1a7f4b' : '#b91c1c';
  const colorBg = pcts[pcts.length-1] >= 0 ? '#eaf7f0' : '#fef2f2';

  const cx = i  => (PL + i / (n||1) * cW).toFixed(1);
  const cy = pct => (PT + (1 - (pct - minP) / rangeP) * cH).toFixed(1);

  const coords  = pcts.map((p, i) => `${cx(i)},${cy(p)}`).join(' ');
  const zeroY   = cy(0);
  const fillPts = `${cx(0)},${zeroY} ${coords} ${cx(n)},${zeroY}`;

  // Y: ~5 niveles equidistantes que incluyan 0
  const step = rangeP <= 5 ? 1 : rangeP <= 15 ? 2 : rangeP <= 40 ? 5 : rangeP <= 100 ? 10 : 20;
  const yTicks = [];
  for (let v = Math.ceil(minP / step) * step; v <= maxP + step * 0.1; v += step)
    yTicks.push(+v.toFixed(1));
  if (!yTicks.includes(0)) yTicks.push(0);
  yTicks.sort((a,b)=>a-b);

  const yGridSvg = yTicks.map(v =>
    `<line x1="${PL}" y1="${cy(v)}" x2="${PL+cW}" y2="${cy(v)}" stroke="${v===0?'#9ca3af':'#e5e7eb'}" stroke-width="${v===0?1.2:0.8}" stroke-dasharray="${v===0?'':'3,3'}"/>`
  ).join('');
  const yLabelsSvg = yTicks.map(v =>
    `<text x="${PL-5}" y="${+cy(v)+3.5}" text-anchor="end" font-size="9" font-weight="700" fill="#6b7280">${v>=0?'+':''}${v.toFixed(1)}%</text>`
  ).join('');

  // X: ticks semanales (cada ~7 días) basados en fechas reales
  const ms0 = new Date(tDates[0]).getTime();
  const msN = new Date(tDates[n]).getTime();
  const spanDays = (msN - ms0) / 86400000;
  const weekMs = 7 * 86400000;
  const xTicksSvg = [];
  let wk = new Date(ms0);
  wk.setDate(wk.getDate() + (7 - wk.getDay()) % 7); // primer lunes
  while (wk.getTime() <= msN + weekMs * 0.5) {
    const frac = (wk.getTime() - ms0) / (msN - ms0 || 1);
    const x = (PL + frac * cW).toFixed(1);
    const label = wk.toISOString().slice(5,10).replace('-','/');
    xTicksSvg.push(
      `<line x1="${x}" y1="${PT}" x2="${x}" y2="${PT+cH}" stroke="#e5e7eb" stroke-width="0.7"/>`,
      `<text x="${x}" y="${H-7}" text-anchor="middle" font-size="9" font-weight="700" fill="#6b7280">${label}</text>`
    );
    wk.setTime(wk.getTime() + weekMs);
  }

  return `<svg viewBox="0 0 ${W} ${H}" class="equity-svg" preserveAspectRatio="none" style="height:120px">
    ${yGridSvg}
    ${xTicksSvg.join('')}
    <line x1="${PL}" y1="${PT}" x2="${PL}" y2="${PT+cH}" stroke="#d1d5db" stroke-width="1"/>
    <polygon points="${fillPts}" fill="${colorBg}" opacity="0.6"/>
    <polyline points="${coords}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>
    ${yLabelsSvg}
  </svg>`;
}

// ─── computeLiveMetrics (copiado de index.html) ──────────────────────
function computeLiveMetrics(trades) {
  const byMagicAccount = {};
  for (const t of trades) {
    const m = String(t.magic || '');
    if (!m || m === '0') continue;
    const acct = t.account_label || String(t.account_id) || 'unknown';
    if (!byMagicAccount[m]) byMagicAccount[m] = {};
    if (!byMagicAccount[m][acct]) byMagicAccount[m][acct] = [];
    byMagicAccount[m][acct].push(t);
  }
  const byMagic = {}, winnerAccount = {};
  for (const [magic, byAccount] of Object.entries(byMagicAccount)) {
    const sorted = Object.entries(byAccount).sort((a, b) => b[1].length - a[1].length);
    byMagic[magic] = sorted[0][1];
    winnerAccount[magic] = sorted[0][0];
  }
  const result = {};
  for (const [magic, list] of Object.entries(byMagic)) {
    list.sort((a, b) => new Date(a.close_time) - new Date(b.close_time));
    const netPs = list.map(t => +((t.profit||0)+(t.commission||0)+(t.swap||0)).toFixed(2));
    const wins  = netPs.filter(p => p > 0);
    const losses= netPs.filter(p => p < 0);
    const gW = wins.reduce((a,b)=>a+b,0);
    const gL = Math.abs(losses.reduce((a,b)=>a+b,0));
    const pf = gL > 0 ? +(gW/gL).toFixed(2) : gW > 0 ? 999 : 0;
    const winRate = list.length ? +(wins.length/list.length*100).toFixed(1) : 0;
    const BASE = 10000;
    let peak=BASE,eq=BASE,maxDD=0;
    netPs.forEach(np => { eq+=np; if(eq>peak)peak=eq; const dd=(peak-eq)/peak; if(dd>maxDD)maxDD=dd; });
    let cum=0;
    const tradeList = list.map(t => {
      const np = +((t.profit||0)+(t.commission||0)+(t.swap||0)).toFixed(2);
      cum = +(cum+np).toFixed(2);
      return {
        openDate:  t.open_time  ? t.open_time.slice(0,16).replace('T',' ')  : '—',
        closeDate: t.close_time ? t.close_time.slice(0,16).replace('T',' ') : '—',
        symbol:    t.symbol||'—',
        action:    t.type==='buy'?'Buy':'Sell',
        lots:      t.lots,
        openPrice: t.open_price,
        closePrice:t.close_price,
        netProfit: np,
        cumProfit: cum,
      };
    });
    result[magic] = {
      pf, ddPct: +(maxDD*100).toFixed(2), winRate,
      trades: list.length,
      avgWinUsd:  wins.length   ? +(gW/wins.length).toFixed(2)   : null,
      avgLossUsd: losses.length ? +(gL/losses.length).toFixed(2) : null,
      netProfit:  +netPs.reduce((a,b)=>a+b,0).toFixed(2),
      tradeList,
      account: winnerAccount[magic] || null,
    };
  }
  return result;
}

// ─── Cuenta filter ────────────────────────────────────────────────────
function populateAccountFilter() {
  const accounts = [...new Set(_allTrades.map(t => t.account_label || String(t.account_id)).filter(Boolean))].sort();
  const sel = document.getElementById('f-account');
  const prev = sel.value;
  sel.innerHTML = '<option value="">Todas</option>' +
    accounts.map(a => `<option${a===prev?' selected':''}>${a}</option>`).join('');
  document.getElementById('acct-wrap').style.display = accounts.length > 1 ? 'flex' : 'none';

  const symbols = [...new Set(_allTrades.map(t => t.symbol).filter(Boolean))].sort();
  const symSel = document.getElementById('f-symbol');
  const prevSym = symSel.value;
  symSel.innerHTML = '<option value="">Todos</option>' +
    symbols.map(s => `<option${s===prevSym?' selected':''}>${s}</option>`).join('');
}

function applyFilters() {
  const acct = document.getElementById('f-account').value;
  const sym  = document.getElementById('f-symbol').value;
  let filtered = _allTrades;
  if (acct) filtered = filtered.filter(t => (t.account_label || String(t.account_id)) === acct);
  if (sym)  filtered = filtered.filter(t => t.symbol === sym);
  LIVE = computeLiveMetrics(filtered);
  renderTable();
}

// ─── Sorting ──────────────────────────────────────────────────────────
var KEY = {
  name:      r => (r.name||'').toLowerCase(),
  symbol:    r => r.symbol||'',
  magic:     r => r.magic,
  account:   r => r.account||'',
  trades:    r => r.trades,
  pf:        r => r.pf,
  dd:        r => r.ddPct,
  wr:        r => r.winRate,
  netProfit: r => r.netProfit,
};
function sortBy(col) {
  if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = -1; }
  document.querySelectorAll('thead span[id^="s-"]').forEach(el => el.textContent = '');
  const ind = document.getElementById('s-' + col);
  if (ind) ind.textContent = sortDir === -1 ? ' ▼' : ' ▲';
  renderTable();
}

// ─── Render tabla ─────────────────────────────────────────────────────
function renderTable() {
  const rows = Object.entries(LIVE).map(([magic, d]) => {
    const bot = _botsByMagic[magic];
    const sym = d.tradeList.length ? d.tradeList[d.tradeList.length-1].symbol : (bot?.symbol || '—');
    return { magic: Number(magic), name: bot?.name || '—', symbol: sym, account: d.account||'—',
      trades: d.trades, pf: d.pf, ddPct: d.ddPct, winRate: d.winRate, netProfit: d.netProfit,
      tradeList: d.tradeList };
  });

  const fn = KEY[sortCol] || (() => '');
  rows.sort((a, b) => { const av = fn(a), bv = fn(b); return av < bv ? sortDir : av > bv ? -sortDir : 0; });
  document.getElementById('f-count').textContent = rows.length + ' magic' + (rows.length !== 1 ? 's' : '');

  const tbody = document.getElementById('mt5-tbody');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="10" class="empty-state">Sin trades. Verifica la conexión MT5 → Supabase.</td></tr>';
    return;
  }

  tbody.innerHTML = rows.map(r => {
    const name = r.name.length > 38 ? r.name.slice(0,36)+'…' : r.name;
    return `<tr data-magic="${r.magic}" onclick="toggleDetail(${r.magic})">
      <td class="left" title="${r.name}">${name}</td>
      <td class="left">${r.symbol}</td>
      <td style="font-variant-numeric:tabular-nums;color:var(--text3)">${r.magic}</td>
      <td class="left">${r.account}</td>
      <td>${r.trades}</td>
      <td class="${pfColor(r.pf)}">${fmt(r.pf)}</td>
      <td class="${ddColor(r.ddPct)}">${fmt(r.ddPct,1)}%</td>
      <td class="${wrColor(r.winRate)}">${fmt(r.winRate,1)}%</td>
      <td class="${npColor(r.netProfit)}">${r.netProfit >= 0 ? '+' : ''}${fmt(r.netProfit,2)}</td>
      <td class="spark">${sparkline(r.tradeList)}</td>
    </tr>`;
  }).join('');

  if (expandedMagic !== null) {
    const row = rows.find(r => r.magic === expandedMagic);
    if (row) insertDetailRow(row);
    else expandedMagic = null;
  }
}

// ─── Ficha expandible ─────────────────────────────────────────────────
function insertDetailRow(row) {
  const tr = document.querySelector(`tr[data-magic="${row.magic}"]`);
  if (!tr) return;
  const detail = document.createElement('tr');
  detail.className = 'detail-row';
  detail.id = 'detail-' + row.magic;
  detail.innerHTML = '<td colspan="10"><div class="detail-inner">' +
    buildDetail(row.magic, LIVE[String(row.magic)]) + '</div></td>';
  tr.insertAdjacentElement('afterend', detail);
}

function toggleDetail(magic) {
  const existing = document.getElementById('detail-' + magic);
  if (existing) {
    existing.remove();
    document.querySelector(`tr[data-magic="${magic}"]`)?.classList.remove('expanded');
    expandedMagic = null;
    return;
  }
  if (expandedMagic !== null) {
    document.getElementById('detail-' + expandedMagic)?.remove();
    document.querySelector(`tr[data-magic="${expandedMagic}"]`)?.classList.remove('expanded');
  }
  expandedMagic = magic;
  const liveData = LIVE[String(magic)];
  if (!liveData) return;
  document.querySelector(`tr[data-magic="${magic}"]`)?.classList.add('expanded');

  const tr = document.querySelector(`tr[data-magic="${magic}"]`);
  if (!tr) return;
  const detail = document.createElement('tr');
  detail.className = 'detail-row';
  detail.id = 'detail-' + magic;
  detail.innerHTML = '<td colspan="10"><div class="detail-inner">' + buildDetail(magic, liveData) + '</div></td>';
  tr.insertAdjacentElement('afterend', detail);
}

function buildDetail(magic, d) {
  const last50 = d.tradeList.slice(-50).reverse();
  let html = '<div class="detail-title">Equity curve</div>';
  html += equityCurve(d.tradeList);
  html += '<div class="detail-title" style="margin-top:14px">Últimos ' + Math.min(50, d.tradeList.length) + ' trades</div>';
  html += '<div style="overflow-x:auto"><table class="trade-table"><thead><tr>' +
    '<th>Cierre</th><th>Symbol</th><th>Tipo</th><th>Lots</th><th>Open</th><th>Close</th><th>Net P&L</th><th>Acum.</th>' +
    '</tr></thead><tbody>';
  let lastMonth = null;
  let monthParity = 0;
  last50.forEach(t => {
    const month = t.closeDate.slice(0, 7);
    if (month !== lastMonth) { lastMonth = month; monthParity = 1 - monthParity; }
    const rowBg = monthParity === 0 ? '' : 'background:#f1f3f5;';
    html += `<tr style="${rowBg}">
      <td>${t.closeDate}</td>
      <td>${t.symbol}</td>
      <td>${t.action}</td>
      <td>${t.lots??'—'}</td>
      <td>${t.openPrice??'—'}</td>
      <td>${t.closePrice??'—'}</td>
      <td class="${t.netProfit>=0?'trade-p':'trade-n'}">${t.netProfit>=0?'+':''}${fmt(t.netProfit,2)}</td>
      <td class="${t.cumProfit>=0?'trade-p':'trade-n'}">${fmt(t.cumProfit,2)}</td>
    </tr>`;
  });
  html += '</tbody></table></div>';
  return html;
}

// ─── Carga de datos ───────────────────────────────────────────────────
async function loadData() {
  setSyncStatus('Cargando trades...', '');
  try {
    const [trades, bots] = await Promise.all([sb.getMyTrades(), sb.getBots().catch(() => [])]);
    _allTrades = trades;
    _botsByMagic = {};
    bots.forEach(b => { if (b.magic) _botsByMagic[String(b.magic)] = b; });
    LIVE = computeLiveMetrics(trades);
    populateAccountFilter();
    renderTable();
    const n = Object.keys(LIVE).length;
    setSyncStatus(`${n} magic${n !== 1 ? 's' : ''} — ${trades.length} trades`, '#1a7f4b');
    setTimeout(() => setSyncStatus('', ''), 5000);
  } catch(e) {
    setSyncStatus('Error al cargar trades', '#b91c1c');
    alertErr('Error: ' + e.message);
  }
}

// ─── Init ─────────────────────────────────────────────────────────────
async function init() {
  if (typeof sb === 'undefined' || !sb.isAuthenticated()) { window.location.href = 'index.html'; return; }
  // acct-wrap se muestra en populateAccountFilter() solo si hay > 1 cuenta
  await loadData();
}
document.addEventListener('DOMContentLoaded', init);

// ─── Importador historial manual ──────────────────────────────────────
var _impTrades = [];

function toggleImporter() {
  const panel = document.getElementById('importer-panel');
  const btn   = document.getElementById('btn-importer-toggle');
  const open  = panel.style.display === 'none';
  panel.style.display = open ? 'block' : 'none';
  btn.textContent = (open ? '▼' : '▶') + ' Importar historial manual';
  if (open) populateImporterSelects();
}

function populateImporterSelects() {
  // Bots
  const botSel = document.getElementById('imp-bot');
  const prev   = botSel.value;
  botSel.innerHTML = '<option value="">— seleccioná un bot —</option>';
  Object.entries(_botsByMagic)
    .sort((a,b) => (a[1].name||'').localeCompare(b[1].name||''))
    .forEach(([magic, bot]) => {
      const opt = document.createElement('option');
      opt.value  = magic;
      opt.textContent = `${bot.name || '?'} — magic ${magic}`;
      if (magic === prev) opt.selected = true;
      botSel.appendChild(opt);
    });

  // Cuentas — toma las que ya están en _allTrades
  const acctSel  = document.getElementById('imp-account');
  const prevAcct = acctSel.value;
  const accounts = [...new Set(_allTrades.map(t => t.account_label).filter(Boolean))].sort();
  acctSel.innerHTML = '<option value="">— seleccioná cuenta —</option>' +
    accounts.map(a => `<option${a===prevAcct?' selected':''}>${a}</option>`).join('');
}

function impParse() {
  const raw     = document.getElementById('imp-raw').value.trim();
  const magic   = document.getElementById('imp-bot').value;
  const account = document.getElementById('imp-account').value;

  if (!magic)   { alertErr('Seleccioná un bot primero');    return; }
  if (!account) { alertErr('Seleccioná una cuenta primero'); return; }
  if (!raw)     { alertErr('Pegá los datos de MyFxBook');   return; }

  // Normalizar: MyFxBook parte "SL\n(Precio)" y "TP\n(Precio)" en líneas separadas
  // Merge de líneas que son continuación de un header (empiezan con "(" y no son fecha)
  const rawLines = raw.split('\n').map(l => l.trim()).filter(Boolean);
  const lines = [];
  for (let i = 0; i < rawLines.length; i++) {
    const l = rawLines[i];
    if (lines.length > 0 && l.startsWith('(') && !l.match(/^\d{2}\.\d{2}\.\d{4}/)) {
      lines[lines.length - 1] += ' ' + l;
    } else {
      lines.push(l);
    }
  }
  const trades = [];
  const warns  = [];

  // Detectar índices de columnas desde el header
  const headerLine = lines.find(l => l.toLowerCase().includes('fecha de apertura'));
  if (!headerLine) { alertErr('No se encontró la fila de headers. Incluí la primera fila de MyFxBook.'); return; }

  const headers = headerLine.split('\t').map(h => h.trim().toLowerCase()
    .replace(/\n/g,' ').replace(/\s+/g,' '));

  const idx = {
    openTime:   headers.findIndex(h => h.includes('fecha de apertura')),
    closeTime:  headers.findIndex(h => h.includes('fecha de cierre')),
    symbol:     headers.findIndex(h => h.includes('símbolo') || h.includes('simbolo')),
    action:     headers.findIndex(h => h.includes('acción') || h.includes('accion')),
    lots:       headers.findIndex(h => h.includes('lotes')),
    sl:         headers.findIndex(h => h.includes('s/l') || (h.includes('sl') && h.includes('precio'))),
    tp:         headers.findIndex(h => h.includes('t/p') || (h.includes('tp') && h.includes('precio'))),
    openPrice:  headers.findIndex(h => h.includes('precio de apertura')),
    closePrice: headers.findIndex(h => h.includes('precio de cierre')),
    profit:     headers.findIndex(h => h.includes('beneficio neto') || h.includes('beneficio')),
    swap:       headers.findIndex(h => h.includes('swap')),
    commission: headers.findIndex(h => h.includes('comision') || h.includes('comisión')),
  };

  const dataLines = lines.filter(l => !l.toLowerCase().includes('fecha de apertura'));

  dataLines.forEach((line, i) => {
    const cols = line.split('\t');

    // Ignorar depósitos y filas sin symbol
    const sym = idx.symbol >= 0 ? (cols[idx.symbol]||'').trim() : '';
    if (!sym) { warns.push(`Fila ${i+1}: sin símbolo — omitida (depósito/resumen)`); return; }

    // Parsear fecha MM.DD.YYYY HH:MM → ISO
    function parseDate(s) {
      if (!s || s === '-') return null;
      s = s.trim();
      const m = s.match(/^(\d{2})\.(\d{2})\.(\d{4})\s+(\d{2}):(\d{2})/);
      if (!m) return null;
      return `${m[3]}-${m[1]}-${m[2]}T${m[4]}:${m[5]}:00`;
    }

    function parseNum(s) {
      if (!s || s.trim() === '-') return 0;
      return parseFloat(s.replace(/,/g,'').trim()) || 0;
    }

    const openTime  = parseDate(idx.openTime  >= 0 ? cols[idx.openTime]  : '');
    const closeTime = parseDate(idx.closeTime >= 0 ? cols[idx.closeTime] : '');

    if (!openTime || !closeTime) {
      warns.push(`Fila ${i+1}: fecha inválida — omitida`);
      return;
    }

    const action = (idx.action >= 0 ? cols[idx.action] : '').trim().toLowerCase();
    const type   = (action === 'comprar' || action === 'buy') ? 'buy' : 'sell';

    trades.push({
      magic:        Number(magic),
      account_label: account,
      symbol:       sym,
      type,
      open_time:    openTime,
      close_time:   closeTime,
      lots:         parseNum(idx.lots       >= 0 ? cols[idx.lots]       : '0'),
      open_price:   parseNum(idx.openPrice  >= 0 ? cols[idx.openPrice]  : '0'),
      close_price:  parseNum(idx.closePrice >= 0 ? cols[idx.closePrice] : '0'),
      sl:           parseNum(idx.sl         >= 0 ? cols[idx.sl]         : '0'),
      tp:           parseNum(idx.tp         >= 0 ? cols[idx.tp]         : '0'),
      profit:       parseNum(idx.profit     >= 0 ? cols[idx.profit]     : '0'),
      swap:         parseNum(idx.swap       >= 0 ? cols[idx.swap]       : '0'),
      commission:   parseNum(idx.commission >= 0 ? cols[idx.commission] : '0'),
    });
  });

  _impTrades = trades;

  // Preview
  const tbody = document.getElementById('imp-preview-tbody');
  tbody.innerHTML = trades.map(t => `<tr>
    <td>${t.open_time.replace('T',' ').slice(0,16)}</td>
    <td>${t.close_time.replace('T',' ').slice(0,16)}</td>
    <td>${t.symbol}</td>
    <td>${t.type}</td>
    <td>${t.lots}</td>
    <td>${t.open_price}</td>
    <td>${t.close_price}</td>
    <td>${t.sl||'—'}</td>
    <td>${t.tp||'—'}</td>
    <td class="${t.profit>=0?'trade-p':'trade-n'}">${t.profit>=0?'+':''}${t.profit.toFixed(2)}</td>
    <td>${t.swap.toFixed(2)}</td>
    <td>${t.commission.toFixed(2)}</td>
  </tr>`).join('');

  const skipped = dataLines.length - trades.length;
  document.getElementById('imp-preview-title').textContent =
    `${trades.length} trades detectados${skipped > 0 ? ` (${skipped} filas omitidas — ver advertencias)` : ''} — verificá antes de importar`;
  document.getElementById('imp-warn').textContent = warns.join(' | ');
  document.getElementById('imp-confirm-btn').textContent = `Importar ${trades.length} trades a Supabase`;
  document.getElementById('imp-preview').style.display = trades.length ? 'block' : 'none';

  if (!trades.length) alertErr('No se detectaron trades válidos. Revisá el formato.');
}

async function impConfirm() {
  if (!_impTrades.length) return;
  const btn = document.getElementById('imp-confirm-btn');
  btn.disabled = true;

  const SUPABASE_URL = 'https://ofrbktacgwbwsgpftoky.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_OReO6Y5yhrK-BmPWf3fOhw_ODQ1-0_-';
  const endpoint     = `${SUPABASE_URL}/rest/v1/trades?on_conflict=ticket,account_id`;
  const authToken    = sb.getToken();

  const userId = JSON.parse(atob(authToken.split('.')[1])).sub;

  const rows = _impTrades.map(t => {
    const hashStr = `${t.magic}_${t.open_time}_${t.close_time}_${t.symbol}`;
    let hash = 0;
    for (let c = 0; c < hashStr.length; c++) hash = Math.imul(31, hash) + hashStr.charCodeAt(c) | 0;
    const syntheticTicket = Math.abs(hash) + 9000000000;

    return {
      user_id:       userId,
      ticket:        syntheticTicket,
      account_id:    'historical',
      account_label: t.account_label,
      magic:         t.magic,
      symbol:        t.symbol,
      type:          t.type,
      open_time:     t.open_time,
      close_time:    t.close_time,
      lots:          t.lots,
      open_price:    t.open_price,
      close_price:   t.close_price,
      sl:            t.sl,
      tp:            t.tp,
      profit:        t.profit,
      commission:    t.commission,
      swap:          t.swap,
      comment:       'myfxbook_import',
    };
  });

  btn.textContent = `Importando ${rows.length} trades...`;

  try {
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: {
        'Content-Type':  'application/json',
        'Authorization': `Bearer ${authToken}`,
        'apikey':        SUPABASE_KEY,
        'Prefer':        'resolution=ignore-duplicates,return=minimal',
      },
      body: JSON.stringify(rows),
    });

    btn.disabled    = false;
    btn.textContent = `Importar ${_impTrades.length} trades a Supabase`;

    if (res.ok || res.status === 409) {
      alertOk(res.status === 409 ? `Trades ya existentes — ignorados sin error` : `Historial importado — ${rows.length} trades enviados`);
      await loadData();
      document.getElementById('imp-raw').value = '';
      document.getElementById('imp-preview').style.display = 'none';
      _impTrades = [];
    } else {
      const txt = await res.text();
      alertErr(`Error ${res.status}: ${txt}`);
    }
  } catch(e) {
    btn.disabled    = false;
    btn.textContent = `Importar ${_impTrades.length} trades a Supabase`;
    alertErr('Error de red: ' + e.message);
  }
}
